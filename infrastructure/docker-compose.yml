services:
  postgres:
    image: postgres:17-alpine
    container_name: beamo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beamo
      POSTGRES_PASSWORD: beamo
      POSTGRES_DB: beamo_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
